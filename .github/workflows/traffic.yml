name: 퇴근길 모니터

on:
  schedule:
    - cron: "25 5 * * 1-5"      # 14:25 KST 평일: 21:00 까지 5분마다 계속 수집 (한 작업)
    - cron: "0 12-20,22 * * 1-5" # 그 외 시간 1시간마다 한 번
    - cron: "0 */2 * * 0,6"      # 주말 2시간마다
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    env:
      TZ: Asia/Seoul
      TOPIS_KEY: ${{ secrets.TOPIS_KEY }}
      KMA_KEY: ${{ secrets.KMA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 수집 루프
        run: |
          # 평일 14:00~21:00 KST 사이에 시작했으면 21:00 까지 5분마다 반복, 아니면 한 번만
          START=$(date +%s)
          while true; do
            ./run.sh || echo "run failed"
            H=$(date +%H); DOW=$(date +%u)
            NOW=$(date +%s)
            if [ "$DOW" -ge 6 ] || [ "$H" -lt 14 ] || [ "$H" -ge 21 ] || [ $((NOW-START)) -gt 22800 ]; then
              echo "loop end"; break
            fi
            sleep 300
          done
