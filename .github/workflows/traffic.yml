name: 퇴근길 모니터

on:
  schedule:
    # 14:30~18:45 KST 사이 15분마다 시도 (GitHub 가 예약을 자주 건너뛰므로). 동시실행 방지돼 있어 하나만 돎.
    - cron: "30,45 5 * * 1-5"
    - cron: "0,15,30,45 6-8 * * 1-5"
    - cron: "0,15,30,45 9 * * 1-5"
  repository_dispatch:
    types: [kick]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Seoul
      TOPIS_KEY: ${{ secrets.TOPIS_KEY }}
      ITS_KEY: ${{ secrets.ITS_KEY }}        # ITS 국가교통정보센터 — 고속도로(제3경인·외곽순환·수원광명) 돌발용
      KMA_KEY: ${{ secrets.KMA_KEY }}
      ITS_RELAY: ${{ secrets.ITS_RELAY }}
      ITS_RELAY_TOKEN: ${{ secrets.ITS_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 수집 루프
        run: |
          # 평일 14:30~19:00 KST 사이에 시작했으면 19:00 까지 5분마다 반복, 아니면 한 번만
          START=$(date +%s)
          while true; do
            ./run.sh || echo "run failed"
            HM=$(date +%H%M); DOW=$(date +%u)
            NOW=$(date +%s)
            if [ "$DOW" -ge 6 ] || [ "$HM" -lt 1430 ] || [ "$HM" -ge 1900 ] || [ $((NOW-START)) -gt 18000 ]; then
              echo "loop end"; break
            fi
            sleep 300
          done
