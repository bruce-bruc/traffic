name: 퇴근길 모니터

on:
  schedule:
    - cron: "40 5 * * 1-5"      # 14:40 KST 평일 (GitHub 지연 감안) → 15:00~19:00 5분마다 계속 수집
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Seoul
      TOPIS_KEY: ${{ secrets.TOPIS_KEY }}
      KMA_KEY: ${{ secrets.KMA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 수집 루프
        run: |
          # 평일 14:30~19:00 KST 사이에 시작했으면 19:00 까지 5분마다 반복, 아니면 한 번만
          START=$(date +%s)
          while true; do
            ./run.sh || echo "run failed"
            HM=$(date +%H%M); DOW=$(date +%u)
            NOW=$(date +%s)
            if [ "$DOW" -ge 6 ] || [ "$HM" -lt 1430 ] || [ "$HM" -ge 1900 ] || [ $((NOW-START)) -gt 18000 ]; then
              echo "loop end"; break
            fi
            sleep 300
          done
