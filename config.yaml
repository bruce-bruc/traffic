# ─────────────────────────────────────────────
#  사당·남태령 퇴근길 모니터 설정
#  인증키를 비워두면 '데모 모드'로 돌아갑니다 (가짜 속도로 전체 흐름만 확인).
# ─────────────────────────────────────────────

api_keys:
  seoul_topis: ""      # 서울 열린데이터광장 (data.seoul.go.kr) 인증키
  its_national: ""     # ITS 국가교통정보센터 (openapi.its.go.kr) 인증키
  gyeonggi_gits: ""    # 경기도 교통정보센터 (gits.gg.go.kr) 인증키
  kma_weather: ""      # 기상청 단기예보 (data.go.kr) 인증키 — 예측 날씨 보정용

# 알림 (둘 중 하나만 채워도 됨. 둘 다 비우면 콘솔 출력만)
notify:
  telegram_bot_token: ""
  telegram_chat_id: ""
  push_time: "16:45"   # 매일 이 시각에 요약 푸시 (HH:MM, Asia/Seoul)

# 폰에서 보기: 생성된 dashboard.html 을 FTP 로 자동 업로드 (카페24 등). 비우면 업로드 안 함.
upload:
  ftp_host: ""         # 예: antamine.com 또는 카페24 FTP 주소
  ftp_user: ""
  ftp_pass: ""
  remote_dir: "/www/traffic"   # 서버 안 올릴 폴더 (없으면 자동 생성)
  remote_name: "index.html"
  public_url: "https://antamine.com/traffic/"   # 폰에서 열 주소 (참고용)

# 수집 주기 / 시간대
collect:
  interval_min: 5
  start: "16:00"
  end: "20:00"
  weekdays_only: true

# ─────────── 구간 정의 ───────────
# link_ids 가 있으면 ITS 실시간 속도, 없으면 fixed_min × 피크계수 로 추정 (링크 범위 밖 구간)
# 노드 순서 = 주행 방향 (과천 22xx → 서울 12xx 이 상행)
segments:
  # ── 공통: 회사 → 고잔IC → 제3경인 끝(갈림길) ──
  - id: gojan_up
    name: "회사 → 고잔IC (제3경인 올라타기)"
    route: all
    link_ids: []          # ITS 중계(its.php) 연결되면 국가 ITS 링크로 실시간 전환
    fixed_min: 5
    peak_extra_ratio: 0.6
  - id: leg_3rd_gyeongin
    name: "고잔IC → 제3경인 끝 갈림길"
    route: all
    link_ids: [1650094600, 2240145400, 2240145500, 2240145600, 2240145300, 2240145700, 2240149600, 2240145800]   # ITS: 고잔 → 제3경인 → 수원광명/외곽순환 갈림길 전 (11-23)
    length_km: 11.2
    free_flow_kmh: 80
    fixed_min: 10
    peak_extra_ratio: 0.3

  # ── A. 수원광명 → 강남순환로 ──
  - id: a_suwon_gwangmyeong
    name: "수원광명 + 강남순환로 (금천·봉천터널)"
    route: A
    link_ids: [2240158500, 2240158800, 2240159600, 2240551200, 2240160600, 2240898700, 2130402300, 2130053200, 2130054200, 2130054800, 2130055400, 2130055800, 2130403200, 1170035003, 1170035400, 1170035700, 1170042800, 2080161900, 1200052000, 1200049800, 1200050100]   # ITS: 갈림길 → 수원광명 → 금천 → 강남순환 봉천터널 나오는 곳 (11-23)
    length_km: 19.3
    free_flow_kmh: 80
    fixed_min: 14
    peak_extra_ratio: 0.5
  - id: a_before_sadang
    name: "봉천터널 나와서 사당IC까지"
    route: A
    source: seoul_topis
    link_ids: [1209910060]
    length_km: 1.0
    free_flow_kmh: 80
  - id: a_sadang_ramp
    name: "사당IC 빠지는 램프"
    route: A
    link_ids: []
    fixed_min: 1
    peak_extra_ratio: 1.5
  - id: a_sadang_to_station
    name: "사당IC 합류 → 사당역"
    route: A
    source: seoul_topis
    link_ids: [1210008100]        # 서울시 링크: 남태령(서울측)~사당역 전체 평균
    length_km: 0.8
    free_flow_kmh: 40

  # ── B/C 공통: 110번 외곽순환 → 과천 ──
  - id: bc_outer_ring
    name: "110번 외곽순환 → 학의JC → 과천봉담"
    route: BC
    link_ids: [2240146000, 2240014601, 2240007800, 2160390500, 2160390700, 2080155400, 2080155600, 2080155800, 2250274600, 2250274800, 2250008800, 2090181200, 2090181400, 2090181700, 2260139800, 2260139500, 2260009100, 2260012100, 2260012200, 2200000100, 2200000600]   # ITS: 갈림길 → 외곽순환 → 학의JC → 과천의왕간 → 과천 입구 (11-23)
    length_km: 20.8
    free_flow_kmh: 80
    fixed_min: 16
    peak_extra_ratio: 0.4
  - id: bc_gwacheon
    name: "과천 시내 (정부청사 앞 과천대로)"
    route: BC
    link_ids: [2200001401, 2200001402, 2200001700, 2200002000, 2200002206, 2200002203, 2200003401, 2200004402]   # ITS: 과천대로 과천 입구 → 정부청사 앞 (11-23)
    length_km: 2.7
    free_flow_kmh: 60
    fixed_min: 4
    peak_extra_ratio: 0.6

  # ── B. 선암IC → 우면산터널 ──
  - id: b_umyeonsan
    name: "선암IC → 우면산터널 → 서초"
    route: B
    source: seoul_topis
    link_ids: [1210000400, 1210008900]
    length_km: 3.4
    free_flow_kmh: 60

  # ── C. 남태령 → 사당역 ──
  - id: c_namtaeryeong
    name: "남태령 고개 → 사당IC"
    route: C
    source: seoul_topis
    link_ids: [1210008100]        # 서울시 링크(남태령 서울측~사당역) 속도를 고개 구간에 적용
    length_km: 2.0
    free_flow_kmh: 50
  - id: c_sadang_to_station
    name: "사당IC → 사당역"
    route: C
    source: seoul_topis
    link_ids: [1210008100]
    length_km: 0.8
    free_flow_kmh: 40

  # ── M. 출근길 (방배동 → 사당역 → 사당IC → … → 고잔IC → 회사). 퇴근 계산에는 안 들어가고 표시·기록만 ──
  - id: m_dongjak_north
    name: "출근 · 방배우성 앞 → 이수 쪽 유턴 (동작대로 북행)"
    route: M
    source: seoul_topis
    link_ids: [1210013300]        # 서울시 링크: 동작대로 사당역 → 이수 방향
    length_km: 0.7
    free_flow_kmh: 40
  - id: m_dongjak_south
    name: "출근 · 유턴 후 → 사당역 (동작대로 남행)"
    route: M
    source: seoul_topis
    link_ids: [1210013200]        # 서울시 링크: 동작대로 이수 방향 → 사당역
    length_km: 0.7
    free_flow_kmh: 40
  - id: m_sadang_front
    name: "출근 · 사당역 → 사당IC (남태령 방향)"
    route: M
    source: seoul_topis
    link_ids: [1210008000]        # 서울시 링크: 사당역 → 남태령(서울측) 하행
    length_km: 2.0
    free_flow_kmh: 50
  - id: m_gojan_down
    name: "출근 · 제3경인 고잔IC → 회사"
    route: M
    link_ids: []                  # ITS 중계 연결 후 실시간
    fixed_min: 5
    peak_extra_ratio: 0.3

# 루트: 모니터 구간 합 + extra_min (집까지 마지막 구간)
routes:
  A:
    name: "수원광명 → 강남순환로 → 사당IC"
    short: "수원광명 쪽"
    includes: [all, A]
    extra_min: 8        # 사당역 → 방배동
  B:
    name: "110번 → 과천 → 우면산터널"
    short: "110번·우면산터널"
    includes: [all, BC, B]
    extra_min: 7        # 터널 출구 → 방배동
  C:
    name: "110번 → 과천 → 남태령 → 사당역"
    short: "110번·남태령"
    includes: [all, BC, C]
    extra_min: 8

# 속도 → 상태 임계치 (km/h)
thresholds:
  smooth: 40
  slow: 20

# ─────────── 예측 ───────────
# 피크 곡선 (모든 fixed_min 구간과 링크 구간 기본값에 공통 적용)
peak:
  hour: 17.75
  width: 0.9
friday_factor: 1.1

# 링크 구간이 실데이터 없을 때 쓰는 기본 감속 프로파일
default_profile:
  all: { peak_hour: 17.75, peak_width: 0.9, max_drop: 0.30 }
  A:   { peak_hour: 17.75, peak_width: 0.8, max_drop: 0.70 }
  BC:  { peak_hour: 17.75, peak_width: 0.9, max_drop: 0.40 }
  B:   { peak_hour: 17.75, peak_width: 0.9, max_drop: 0.35 }
  C:   { peak_hour: 17.75, peak_width: 0.8, max_drop: 0.75 }

# 돌발·행사 가산: 영향 루트 소요시간 × 계수 (여러 건이면 최대 1개만 적용)
incident_factors:
  accident: 1.35      # 사고·고장차
  construction: 1.15  # 공사
  control: 1.30       # 집회·행사 통제
  other: 1.15

weather_factors:
  rain: 1.25
  heavy_rain: 1.45
  snow: 1.8

weather_grid: { nx: 60, ny: 125 }   # 기상청 격자 (서초/과천 부근)

plan:
  earliest_depart: "15:30"
  latest_depart: "20:00"
  push_time: "15:00"         # 오전/오후 예측표 푸시 시각
